name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@6bf36eb2f06db5cfee754b34f0fd3a0783f0dcb5 # v0.6.178
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      recipe: verify-backend
      prepare: setup-backend
      python-version: '3.12.16'
      uv-version: '0.13.9'
      timeout-minutes: 20

  frontend:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@6bf36eb2f06db5cfee754b34f0fd3a0783f0dcb5 # v0.6.178
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      recipe: verify-frontend
      prepare: setup-frontend
      node-version: '26.13.1'
      timeout-minutes: 15

  workflows:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@6bf36eb2f06db5cfee754b34f0fd3a0783f0dcb5 # v0.6.178
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      recipe: security
      fetch-depth: 0
      tools: shellcheck@0.11.0,zizmor@1.32.0
      tool-assets: .github/hosted-tools.json
      timeout-minutes: 10

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@6bf36eb2f06db5cfee754b34f0fd3a0783f0dcb5 # v0.6.178
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04

  gate:
    needs: [backend, frontend, workflows, merge-stops]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job ended as expected
        env:
          NEEDS: ${{ toJSON(needs) }}
          MERGE_STOPS: ${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}
        run: |
          jq -e --arg stop "$MERGE_STOPS" '
            map_values(.result) == {
              backend: "success", frontend: "success", workflows: "success", "merge-stops": $stop
            }
          ' <<< "$NEEDS"
